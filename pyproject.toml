[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcm-hardware"
version = "0.1.0"
description = "Version Control for Hardware: engineering-aware version control and intelligence above Git"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
appwrite = ["appwrite>=27.1"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "ruff>=0.4", "pyyaml>=6", "appwrite>=27.1"]

[project.scripts]
vcm = "vcm_cli.main:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = [
  "packages/core", "packages/file-parsers", "packages/diff-engine", "packages/workflow",
  "packages/vcm-cli", "services/engineering-graph", "services/ai-engine",
  "services/validation", "services/traceability", "services/api",
]

[tool.setuptools.package-data]
vcm_ai = ["data/*.json"]
vcm_api = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/core", "packages/file-parsers", "packages/diff-engine", "packages/workflow",
  "packages/vcm-cli", "services/engineering-graph", "services/ai-engine",
  "services/validation", "services/traceability", "services/api",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "packages/core", "packages/file-parsers", "packages/diff-engine", "packages/workflow",
  "packages/vcm-cli", "services/engineering-graph", "services/ai-engine",
  "services/validation", "services/traceability", "services/api", "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
