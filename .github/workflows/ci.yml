name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  hardware-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the end-to-end demo (diff, impact, validation, release, devices)
        run: bash examples/demo.sh
      - name: Validate sample BOMs
        run: |
          vcm bom validate examples/sample-pcb/v1.0/bom/bom_v1.0.csv
          vcm bom validate examples/sample-pcb/v1.1/bom/bom_v1.1.csv
