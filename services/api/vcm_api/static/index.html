<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCM Hardware Dashboard</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --card:#fff; --line:#d9d9d4; --muted:#6b6b66;
          --ok:#1b7f4b; --warn:#b26a00; --spec:#5b5b9a; --crit:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --card:#1f1f1d; --line:#3a3a36; --muted:#9a9a93;
            --ok:#4cc38a; --warn:#e0a03a; --spec:#a0a0e0; --crit:#f2766e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  header, main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { margin:0; font-size:1.4rem; } .tag { color:var(--muted); margin:0 0 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin:16px 0; }
  h2 { margin:0 0 8px; font-size:1.1rem; }
  select, button, input { font:inherit; padding:4px 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .item { border-top:1px solid var(--line); padding:6px 0; }
  .muted { color:var(--muted); } code { font-family:ui-monospace,monospace; font-size:.9em; }
  .cls { border-left:4px solid; padding-left:12px; margin:12px 0; }
  .cls.verified { border-color:var(--ok); } .cls.rule_based { border-color:var(--warn); }
  .cls.speculative { border-color:var(--spec); border-style:dashed; }
  .sev-critical { color:var(--crit); font-weight:600; } .sev-warning { color:var(--warn); }
  .badge { font-size:.75rem; border:1px solid currentColor; border-radius:10px; padding:0 6px; margin-right:6px; }
  pre { overflow:auto; background:var(--bg); padding:8px; border-radius:6px; max-height:320px; }
  img.qr { width:140px; height:140px; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>VCM Hardware</h1>
  <p class="tag">Every hardware revision has a story. VCM makes it traceable.</p>
  <div id="repo" class="muted"></div>
</header>
<main>
  <section><h2>Timeline</h2><div id="timeline">Loading...</div></section>
  <section>
    <h2>Compare revisions</h2>
    <div class="row">
      <label>From <select id="a"></select></label>
      <label>To <select id="b"></select></label>
      <button id="go">Diff and impact</button>
    </div>
  </section>
  <section><h2>Semantic diff</h2><div id="diff" class="muted">Choose two revisions.</div></section>
  <section><h2>Impact report</h2><div id="impact" class="muted">Choose two revisions.</div></section>
  <section>
    <h2>Device passport</h2>
    <div class="row"><select id="dev"></select><button id="pp">Show passport</button></div>
    <div id="passport" class="muted">No device selected.</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else e.setAttribute(k, v); }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const label = (r) => r.short + (r.tags.length ? " (" + r.tags.join(", ") + ")" : "") + " " + r.message;

async function init() {
  try {
    const info = await api("/api/repo");
    $("repo").textContent = info.path + " | branch " + (info.branch || "detached");
    const tl = await api("/api/timeline");
    const box = $("timeline"); box.textContent = "";
    for (const r of tl) {
      const ch = Object.entries(r.changes).map(([k, v]) => k + " " + v).join(", ") || "no semantic change";
      box.append(h("div", {class: "item"}, h("code", {}, r.short), " ", r.tags.map(t => h("span", {class: "badge"}, t)),
        r.message, h("div", {class: "muted"}, r.timestamp + " | " + r.author + " | " + ch +
          (r.validation ? " | validation " + r.validation : "") + (r.devices ? " | " + r.devices + " device(s)" : ""))));
    }
    for (const id of ["a", "b"]) {
      const sel = $(id); sel.textContent = "";
      for (const r of tl) sel.append(h("option", {value: r.id}, label(r)));
    }
    if (tl.length > 1) { $("a").value = tl[1].id; $("b").value = tl[0].id; }
    const devs = await api("/api/devices");
    $("dev").textContent = "";
    for (const d of devs) $("dev").append(h("option", {value: d.serial}, d.serial));
  } catch (e) { $("timeline").textContent = "Error: " + e.message; }
}

function renderDiff(d) {
  const box = $("diff"); box.textContent = "";
  const lines = [];
  d.bom.replaced.forEach(x => lines.push("~ " + x.ref + " replaced: " + x.old.value + " -> " + x.new.value));
  d.bom.value_changed.forEach(x => lines.push("~ " + x.ref + " value: " + x.old_value + " -> " + x.new_value));
  d.bom.added.forEach(x => lines.push("+ " + x.ref + " " + x.value));
  d.bom.removed.forEach(x => lines.push("- " + x.ref + " " + x.value));
  d.pcb.footprint_changes.forEach(x => lines.push("footprint " + x.ref + ": " + x.old + " -> " + x.new));
  d.pcb.moved.forEach(x => lines.push("moved " + x.ref + " " + x.distance_mm + " mm"));
  d.nets.changed.forEach(x => lines.push("net " + x.net + " changed"));
  box.append(lines.length ? h("pre", {}, lines.join("\n")) : "No semantic changes.");
}

const CLS = [["verified", "Verified", "From parsed data, declared links and stored evidence"],
             ["rule_based", "Rule-based", "Heuristic warnings; check against datasheets"],
             ["speculative", "Speculative", "Predictions, not established"]];
function evText(e) {
  return e.type === "file" ? "file " + e.path + " @" + e.hash.slice(0, 8)
    : e.type === "commit" ? "commit " + e.revision.slice(0, 10) : e.type + " " + (e.ref || e.part || "");
}
function renderImpact(rep) {
  const box = $("impact"); box.textContent = "";
  for (const [cls, title, blurb] of CLS) {
    const items = rep.findings.filter(f => f.confidence_class === cls);
    box.append(h("div", {class: "cls " + cls}, h("strong", {}, title + " (" + items.length + ")"),
      h("div", {class: "muted"}, blurb),
      items.map(f => h("div", {class: "item"},
        h("span", {class: "sev-" + f.severity}, "[" + f.severity + "] "), h("strong", {}, f.id + " " + f.title),
        h("div", {}, f.detail), h("div", {class: "muted"}, "evidence: " + f.evidence.map(evText).join("; "))))));
  }
  box.append(h("strong", {}, "Required re-tests"),
    h("ul", {}, rep.required_retests.map(r => h("li", {}, r.name + " (" + r.confidence_class + "): " + r.reason))));
}

$("go").onclick = async () => {
  const q = "a=" + encodeURIComponent($("a").value) + "&b=" + encodeURIComponent($("b").value);
  try { renderDiff(await api("/api/diff?" + q)); } catch (e) { $("diff").textContent = "Error: " + e.message; }
  try { renderImpact(await api("/api/impact?" + q)); } catch (e) { $("impact").textContent = "Error: " + e.message; }
};
$("pp").onclick = async () => {
  const box = $("passport"); box.textContent = "";
  const s = $("dev").value; if (!s) return;
  try {
    const p = await api("/api/devices/" + encodeURIComponent(s) + "/passport");
    const slim = Object.assign({}, p, {qr: {payload: p.qr.payload}});
    box.append(h("img", {class: "qr", src: "/api/devices/" + encodeURIComponent(s) + "/qr.svg", alt: "QR code for " + s}),
      h("pre", {}, JSON.stringify(slim, null, 2)));
  } catch (e) { box.textContent = "Error: " + e.message; }
};
init();
</script>
</body>
</html>
