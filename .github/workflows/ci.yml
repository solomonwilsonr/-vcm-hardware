name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  hardware-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Node demo (diff, impact, validation, release, fleet lineage)
        run: bash examples/demo.sh
      - name: Board demo (the original domain, kept working)
        run: VCM_DEMO_DIR="${RUNNER_TEMP}/pcb-demo" bash examples/demo-pcb.sh
      - name: Catalog coverage is reported, not assumed
        working-directory: demo-workspace
        run: vcm catalog coverage --rev v1.1 --json
      - name: Validate sample BOMs
        run: |
          vcm bom validate examples/sample-pcb/v1.0/bom/bom_v1.0.csv
          vcm bom validate examples/sample-pcb/v1.1/bom/bom_v1.1.csv
